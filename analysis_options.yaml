include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # These are style preferences, not correctness problems; CI runs
    # `flutter analyze` and must not fail the build over them.
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    use_build_context_synchronously: ignore
    # Interpolating a bare $variable next to Arabic letters is unreadable —
    # ${sukun} makes the boundary visible. The braces are deliberate.
    unnecessary_brace_in_string_interps: ignore
  exclude:
    - "**/*.g.dart"

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
