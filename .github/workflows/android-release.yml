name: Build & Release APK

on:
  push:
    branches: [main, "focus-app", "focus-app-*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect outputs
        run: |
          mkdir -p out
          # assembleRelease creates an unsigned APK by default if signing isn't configured
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/Tamarkuz-v1.0.${VERSION_CODE}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/Tamarkuz-v1.0.${VERSION_CODE}.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: tamarkuz-${{ github.run_number }}
          path: out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: تمرکز v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            د تمرکز اپ — نوی بیلډ له `${{ github.ref_name }}` څخه.

            **نصبول:** `Tamarkuz-v1.0.${{ github.run_number }}.apk` ښکته کړئ او په تلیفون کې یې نصب کړئ.
          files: out/*
